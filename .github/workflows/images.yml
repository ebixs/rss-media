name: Build Instagram images

on:
  push:
    paths:
      - "posts/**/post.md"
      - "posts/**/REGENERATE"
      - "scripts/**"
  workflow_dispatch: {}
  schedule:
    - cron: "41 * * * *"   # hourly safety net in case a push did not trigger

permissions:
  contents: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow with Persian text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libraqm0 libfribidi0 libharfbuzz0b
          pip install --quiet "Pillow>=11"
          python -c "from PIL import features; assert features.check('raqm'), 'raqm missing'"

      - name: Generate and compose
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/generate.py

      - name: Commit images
        if: always()
        run: |
          git config user.name "rss-media-bot"
          git config user.email "rss-media-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet && exit 0
          git commit -m "Build images"
          git pull --rebase --quiet
          git push
