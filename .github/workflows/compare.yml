name: Compare image models

on:
  push:
    paths:
      - "compare/prompt.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render with each model
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/compare.py
      - name: Commit results
        run: |
          git config user.name "rss-media-bot"
          git config user.email "rss-media-bot@users.noreply.github.com"
          git add -A compare
          git diff --cached --quiet && exit 0
          git commit -m "Model comparison results"
          git pull --rebase --quiet
          git push
