name: Character images

on:
  push:
    paths:
      - "characters/jobs.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "Pillow>=11"
      - name: Render
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_REEL_ACCOUNT_ID: ${{ secrets.CF_REEL_ACCOUNT_ID }}
          CF_REEL_API_TOKEN: ${{ secrets.CF_REEL_API_TOKEN }}
        run: python scripts/character.py
      - name: Commit
        if: always()
        run: |
          git config user.name "rss-media-bot"
          git config user.email "rss-media-bot@users.noreply.github.com"
          git add -A characters
          git diff --cached --quiet && exit 0
          git commit -m "Character images"
          git pull --rebase --quiet
          git push
